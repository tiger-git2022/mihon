# Fork (tiger-git2022/mihon): build signed release APKs and publish them as a GitHub Release.
#
# Version scheme: the fork's own semantic version, tag/versionName "vX.Y.Z". .github/fork-version holds
# X.Y: a pull request with a new feature (or an upstream update) raises Y, a big change raises X. Z counts
# the releases of X.Y from 0, so a fix needs no edit. versionCode X * 10000000 + Y * 10000 + Z, above the
# earlier "v<upstream>-tNNN" releases (upstream versionCode * 1000 + N). The in-app updater compares
# versions the same way (domain/.../release/interactor/ForkVersion.kt).
name: Tiger Release

on:
  push:
    branches:
      - custom
    paths-ignore:
      - '**.md'
      - 'fastlane/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Release even if this commit has already been released'
        type: boolean
        default: false
      skip_tests:
        description: 'Skip unit tests'
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: 'Branch to release'
        type: string
        default: custom
      skip_tests:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-26.04
    # One release at a time, so build numbers never collide
    concurrency:
      group: tiger-release
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          existing=$(git tag --points-at HEAD --list 'v*' | head -n 1)
          if [ -n "$existing" ] && [ "$FORCE" != "true" ]; then
            echo "Commit $(git rev-parse --short HEAD) was already released as $existing, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          upstream_name=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$upstream_name" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          series=$(tr -d '[:space:]' < .github/fork-version)
          if ! [[ "$series" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::.github/fork-version must hold MAJOR.MINOR, such as 2.4, not '$series'"
            exit 1
          fi
          last=$(git tag --list "v${series}.*" | sed "s/^v${series}\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
          if [ -n "$last" ]; then patch=$(( last + 1 )); else patch=0; fi
          version_name="$series.$patch"
          # A lower X.Y in .github/fork-version would publish a release older than the latest one
          newest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$newest" ] && [ "$(printf '%s\n' "$newest" "v$version_name" | sort -V | tail -n 1)" != "v$version_name" ]; then
            echo "::error::v$version_name would be older than $newest, raise .github/fork-version"
            exit 1
          fi
          IFS=. read -r major minor <<< "$series"
          version_code=$(( major * 10000000 + minor * 10000 + patch ))
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)

          {
            echo "skip=false"
            echo "upstream_name=$upstream_name"
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "tag=v$version_name"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$version_name (versionCode $version_code), upstream $upstream_name, previous release: ${previous:-none}"

      - name: Set up JDK
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        if: steps.version.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Decode signing keystore
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

          # Signature hash used by MSAL: Base64(SHA-1(signing certificate))
          hash=$(keytool -exportcert -alias "$KEY_ALIAS" -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" | openssl sha1 -binary | openssl base64 -A)
          encoded=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$hash")
          echo "SIGNATURE_HASH=$hash" >> "$GITHUB_ENV"
          echo "REDIRECT_URI=msauth://app.mihon.tiger/$encoded" >> "$GITHUB_ENV"

      - name: Run unit tests
        if: steps.version.outputs.skip != 'true' && !inputs.skip_tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed release APKs
        if: steps.version.outputs.skip != 'true'
        env:
          # Enables the env based signing config in app/build.gradle.kts. Only set for this
          # step: that config reads the keystore env vars below, which other steps don't have.
          MIHON_GITHUB_RELEASE: true
          storeFile: ${{ runner.temp }}/release.keystore
          storePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: >-
          ./gradlew assembleRelease
          -Ptiger.version=${{ steps.version.outputs.version_name }}
          -Pinclude-telemetry=false
          -Penable-updater=true

      - name: Collect APKs
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          out=app/build/outputs/apk/release
          mkdir -p dist
          # Asset names must contain the ABI as "-<abi>" (and the universal APK none of them),
          # that is how the in-app updater picks the APK for the device (ReleaseServiceImpl).
          mv "$out/app-universal-release.apk" "dist/mihon-tiger-$TAG.apk"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            mv "$out/app-$abi-release.apk" "dist/mihon-tiger-$abi-$TAG.apk"
          done
          ls -l dist

          # Make sure the APKs are signed with the release key
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "dist/mihon-tiger-$TAG.apk" | tee "$RUNNER_TEMP/certs.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::APK is signed with the debug key"
            exit 1
          fi

      # Notes are Chinese first, then English: commit / PR titles are written as "中文 / English".
      - name: Write release notes
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          UPSTREAM: ${{ steps.version.outputs.upstream_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          if [ -n "$PREVIOUS" ]; then
            changes=$(git log --first-parent --pretty='- %s (%h)' "$PREVIOUS..HEAD")
          else
            changes=$(git log --first-parent --pretty='- %s (%h)' -n 20 HEAD)
          fi
          cat > release-notes.md <<EOF
          基于上游 [Mihon v$UPSTREAM](https://github.com/mihonapp/mihon/releases/tag/v$UPSTREAM)，附加 OneDrive 书架同步和全局搜索历史。

          ### 本次更新
          ${changes:-- 无代码改动}

          ### 下载
          - 大多数手机选 \`mihon-tiger-arm64-v8a-$TAG.apk\`
          - 不确定就选通用版 \`mihon-tiger-$TAG.apk\`

          包名 \`app.mihon.tiger\`，versionCode $VERSION_CODE，可与官方 Mihon 同时安装。

          ---

          Based on upstream [Mihon v$UPSTREAM](https://github.com/mihonapp/mihon/releases/tag/v$UPSTREAM), with OneDrive library sync and global search history. The changes are listed above.

          **Download:** most phones take \`mihon-tiger-arm64-v8a-$TAG.apk\`; if unsure, the universal \`mihon-tiger-$TAG.apk\`. Package \`app.mihon.tiger\`, versionCode $VERSION_CODE, installs beside the official Mihon.

          <details><summary>签名信息 / Signing info</summary>

          - 签名证书 SHA-1（Base64）/ Signing certificate SHA-1 (Base64)：\`$SIGNATURE_HASH\`
          - MSAL / Azure 重定向 URI / redirect URI：\`$REDIRECT_URI\`

          </details>
          EOF
          cat release-notes.md
          {
            echo "## $TAG"
            echo
            echo "- Azure redirect URI: \`$REDIRECT_URI\`"
            echo "- Signature hash: \`$SIGNATURE_HASH\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "Mihon Tiger $TAG" \
            --notes-file release-notes.md \
            --latest

          # The app reads this from /releases/latest/download/update.json: the API's release object, served like
          # any release download, without api.github.com's limit of 60 requests an hour per IP.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '{
            tag_name, body, html_url,
            assets: [.assets[] | select(.name | endswith(".apk")) | {name, browser_download_url}]
          }' > update.json
          cat update.json
          gh release upload "$TAG" update.json --repo "$GITHUB_REPOSITORY" --clobber
