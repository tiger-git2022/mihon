# Fork (tiger-git2022/mihon): follow upstream releases.
#
# Every 6 hours, merge the latest mihonapp/mihon release tag into `custom`. If the merge is clean and
# the app builds and passes unit tests, push it and publish a new release. Otherwise push nothing,
# put the conflicting files or the build log in the run summary (and an issue, if issues are on),
# and fail the run so GitHub sends a notification.
#
# Scheduled workflows only run from the default branch, so `custom` must be the default branch.
name: Tiger Sync Upstream

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

concurrency:
  group: tiger-sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  UPSTREAM_REPO: mihonapp/mihon
  TARGET_BRANCH: custom

jobs:
  sync:
    name: Merge latest upstream release
    runs-on: ubuntu-26.04
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
      tag: ${{ steps.check.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          # Optional PAT (contents + workflows write). Without it the push uses GITHUB_TOKEN.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Find latest upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)
          echo "Latest upstream release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --no-tags upstream "+refs/tags/$tag:refs/tags/$tag"

          if git merge-base --is-ancestor "$tag^{commit}" HEAD; then
            echo "$tag is already part of $TARGET_BRANCH, nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge
        id: merge
        if: steps.check.outputs.needed == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A conflicted merge exits non-zero; the conflict check below handles it.
          git merge --no-ff --no-commit "$TAG" || true

          # Upstream's workflows never land in this fork: they need upstream-only secrets, and
          # pushing workflow changes needs a token with the "workflows" permission.
          git rm -r -q -f --cached --ignore-unmatch -- .github/workflows
          rm -rf .github/workflows
          git checkout HEAD -- .github/workflows

          conflicts=$(git diff --name-only --diff-filter=U)
          if [ -n "$conflicts" ]; then
            echo "Merge conflicts:"
            echo "$conflicts"
            echo "$conflicts" > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit --no-edit -m "合并上游 $TAG / Merge upstream $TAG into $TARGET_BRANCH"
          echo "result=merged" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        if: steps.merge.outputs.result == 'merged'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        if: steps.merge.outputs.result == 'merged'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build & test
        id: build
        if: steps.merge.outputs.result == 'merged'
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleRelease \
            -Ptiger.buildNumber=1 -Pinclude-telemetry=false -Penable-updater=true \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Push
        id: push
        if: steps.merge.outputs.result == 'merged' && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          git push origin "HEAD:$TARGET_BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Upload build log
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-sync-build-log
          path: ${{ runner.temp }}/build.log

      - name: Open issue
        if: >-
          always() && steps.check.outputs.needed == 'true' &&
          steps.push.outputs.pushed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          MERGE_RESULT: ${{ steps.merge.outputs.result }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/issue.md"
          {
            echo "自动合并上游 [$TAG](https://github.com/$UPSTREAM_REPO/releases/tag/$TAG) 到 \`$TARGET_BRANCH\` 失败，没有推送任何改动。"
            echo
            echo "工作流运行：$RUN_URL"
            echo
            if [ "$MERGE_RESULT" = "conflict" ]; then
              echo "### 冲突文件"
              echo
              sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts.txt"
            elif [ "$BUILD_OUTCOME" = "failure" ]; then
              echo "### 编译或单元测试失败"
              echo
              echo "合并本身没有冲突。完整日志见运行页面的 artifact \`upstream-sync-build-log\`，最后 150 行："
              echo
              echo '<details><summary>build.log</summary>'
              echo
              echo '```'
              tail -n 150 "$RUNNER_TEMP/build.log" | cut -c 1-300
              echo '```'
              echo
              echo '</details>'
            elif [ "$PUSH_OUTCOME" = "failure" ]; then
              echo "### 推送失败"
              echo
              echo "合并和编译都成功了，但推送被拒绝。如果上游改动了 \`.github/workflows\`，GITHUB_TOKEN 没有推送权限，"
              echo "需要在仓库 Secrets 里配置 \`SYNC_TOKEN\`（有 Contents 和 Workflows 写权限的 PAT）。"
            else
              echo "### 工作流在合并前出错"
              echo
              echo "请查看运行日志。"
            fi
            echo
            echo "### 手动处理"
            echo
            echo '```sh'
            echo "git fetch https://github.com/$UPSTREAM_REPO.git tag $TAG --no-tags"
            echo "git checkout $TARGET_BRANCH"
            echo "git merge --no-ff $TAG"
            echo "# 上游的工作流文件不要合进来："
            echo "git rm -r -q -f --cached --ignore-unmatch -- .github/workflows && rm -rf .github/workflows && git checkout HEAD -- .github/workflows"
            echo '```'
          } > "$body"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"

          # Issues may be turned off for this repository; the run summary and the failed run's
          # notification are enough then.
          title="Upstream sync failed: $TAG"
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)" = "true" ]; then
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
              --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
            fi
          fi

          if [ "$MERGE_RESULT" = "conflict" ]; then
            echo "::error title=合并上游 $TAG 有冲突 / Upstream merge conflicts::$(paste -sd ' ' "$RUNNER_TEMP/conflicts.txt")"
          else
            echo "::error title=同步上游 $TAG 失败 / Upstream sync failed::见运行摘要 / See the run summary"
          fi
          exit 1

  release:
    name: Release
    needs: sync
    if: needs.sync.outputs.pushed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/tiger-release.yml
    with:
      ref: custom
      skip_tests: true
    secrets: inherit
